name: External cron pinger

# Vercel-side cron scheduling has been silent for unclear reasons
# (registered correctly but not firing — see 2026-06-15 incident), and
# GitHub throttles *scheduled* workflow triggers on this repo to one
# every 2-5 hours (observed Aug-Sep 2026), which starved time-sensitive
# paths (new-coin bot ticks, reconcile) far below the intended 5-minute
# cadence.
#
# Fix (2026-09-04): GitHub throttles trigger CREATION, not running jobs.
# Each run is now a long-lived pinger: it loops for ~5.5 hours firing
# every endpoint on its 5-minute cadence, then dispatches its own
# successor via workflow_dispatch. The */5 schedule remains as a backup
# trigger — queued runs wait behind the active loop (concurrency group)
# and take over if a run dies mid-loop or the self-dispatch fails.
#
# Endpoint handlers check `x-vercel-cron: 1` and run the cron body when
# present (same code path as Vercel's invocation). Everything pinged is
# idempotent, so overlap or double-fire is safe.
#
# To STOP the chain: disable the workflow in the Actions UI (a finishing
# run cannot dispatch a disabled workflow).

on:
  schedule:
    # Backup trigger only — the active loop provides the real cadence.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write # lets a finishing run dispatch its successor

concurrency:
  group: external-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 5-minute pinger loop (~5.5h per run, self-chaining)
        run: |
          # No `set -e`: a failed tick must never kill the loop. Every
          # parse is jq-guarded (a Cloudflare 522 HTML body used to crash
          # python json.load and fail the whole run — 2026-08-14).
          BASE="https://prooflaunch.fun"

          ping() { # $1 = path, $2 = label
            echo "── $2"
            curl -sS -X GET "$BASE$1" -H "x-vercel-cron: 1" --max-time 110 \
              -w "\nHTTP %{http_code} time=%{time_total}s\n" 2>&1 | tail -c 500 || echo "(curl failed — continuing)"
          }

          buyback_fanout() {
            echo "── buyback fan-out"
            RAW=$(curl -sS -X GET "$BASE/api/buyback/process" -H "x-vercel-cron: 1" --max-time 30 || echo "")
            BOT_IDS=$(echo "$RAW" | jq -r '.bots[]?' 2>/dev/null | tr '\n' ' ' || true)
            if [ -z "${BOT_IDS// /}" ]; then
              echo "no live bots (or non-JSON edge response)"
              return 0
            fi
            printf '%s\n' $BOT_IDS | xargs -P 5 -I {} sh -c '
              res=$(curl -sS -X POST "'"$BASE"'/api/buyback/process" \
                -H "x-vercel-cron: 1" -H "Content-Type: application/json" \
                -d "{\"bot_id\":\"{}\"}" --max-time 120 || echo "{\"ok\":false,\"error\":\"curl_failed\"}")
              ok=$(echo "$res" | jq -r ".ok // false" 2>/dev/null || echo false)
              action=$(echo "$res" | jq -r ".action // \"?\"" 2>/dev/null || echo "?")
              symbol=$(echo "$res" | jq -r ".symbol // \"?\"" 2>/dev/null || echo "?")
              if [ "$ok" = "true" ]; then
                echo "OK  {} [$symbol/$action]"
              else
                err=$(echo "$res" | jq -r "(.error // \"non-JSON response\") | .[0:120]" 2>/dev/null || echo "non-JSON response")
                echo "ERR {} [$symbol/$action]: $err"
              fi
            ' || true
          }

          # ~5.5h of 5-minute ticks, then hand off to the successor run.
          END=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $END ]; do
            NOW=$(date -u +%H:%M)
            MIN=$(date -u +%M); MIN=$((10#$MIN))
            HR=$(date -u +%H)
            echo ""
            echo "════ tick $NOW UTC ════"

            ping "/api/fees/process" "fees/process"
            ping "/api/process-memes" "process-memes"
            buyback_fanout

            if [ $((MIN % 15)) -lt 5 ]; then
              ping "/api/reconcile" "reconcile (15m)"
            fi
            if [ $((MIN % 10)) -lt 5 ]; then
              ping "/api/keycard/sync" "keycard/sync (10m)"
            fi
            if [ $MIN -lt 5 ]; then
              ping "/api/airdrop/daily" "airdrop/daily (hourly)"
              ping "/api/wallet-claim/burn" "wallet-claim/burn (hourly)"
            fi
            if [ "$HR" = "13" ] && [ $MIN -lt 5 ]; then
              ping "/api/health/drift" "health/drift (daily 13:00)"
            fi

            sleep 300
          done
          echo "loop window complete — handing off to successor"

      - name: dispatch successor run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run external-cron.yml -R "${{ github.repository }}" \
            && echo "successor dispatched" \
            || echo "dispatch failed — */5 schedule will pick up (throttled backup)"

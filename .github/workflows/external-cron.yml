name: External cron pinger

# Vercel-side cron scheduling has been silent for unclear reasons
# (registered correctly but not firing — see 2026-06-15 incident).
# This workflow pings the same GET endpoints Vercel cron would hit,
# on the same cadence, via GitHub Actions. The endpoint handlers
# check for `x-vercel-cron: 1` header and run the cron body when
# present (same code path as Vercel's invocation).
#
# We keep vercel.json's cron config intact so we have belt + braces
# when Vercel's scheduling comes back. Both firing one cron tick is
# safe — the underlying logic is idempotent (subescrow drain only
# does work when there's something to drain, buyback dispatcher
# enumerates current bot stack each call, etc.).

on:
  schedule:
    # Every 5 minutes — matches Vercel's */5 schedule for fees + process-memes
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

concurrency:
  # If a tick takes >5min, the next tick skips rather than piling on
  group: external-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Determine current minute mod 5
        id: now
        run: |
          MIN=$(date -u +%M)
          MIN=${MIN#0}
          [ -z "$MIN" ] && MIN=0
          MOD=$((MIN % 5))
          echo "minute_mod_5=$MOD" >> $GITHUB_OUTPUT

      - name: fees/process (every 5 min, on the :00 :05 :10 ... mark)
        run: |
          curl -sS -X GET "https://prooflaunch.fun/api/fees/process" \
            -H "x-vercel-cron: 1" --max-time 110 \
            -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 800

      - name: process-memes (every 5 min)
        run: |
          curl -sS -X GET "https://prooflaunch.fun/api/process-memes" \
            -H "x-vercel-cron: 1" --max-time 110 \
            -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 800

      - name: buyback/process (every 5 min, offset by ~2 min from fees)
        run: |
          # Vercel schedule is `2-57/5` — fire on :02 :07 :12 .... Since GH
          # cron is locked to `*/5` (no offset mid-job), we just always fire
          # after fees in the same tick; cycle is small enough that the 30s
          # delay doesn't matter.
          curl -sS -X GET "https://prooflaunch.fun/api/buyback/process" \
            -H "x-vercel-cron: 1" --max-time 110 \
            -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 1200

      - name: reconcile (every 15 min — only on :00, :15, :30, :45)
        if: ${{ steps.now.outputs.minute_mod_5 == '0' }}
        run: |
          MIN=$(date -u +%M)
          if [ $((10#$MIN % 15)) -eq 0 ]; then
            curl -sS -X GET "https://prooflaunch.fun/api/reconcile" \
              -H "x-vercel-cron: 1" --max-time 110 \
              -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 600
          else
            echo "skipped — not a 15-min mark"
          fi

      - name: keycard/sync (every 10 min — only on :00, :10, :20...)
        run: |
          MIN=$(date -u +%M)
          if [ $((10#$MIN % 10)) -eq 0 ]; then
            curl -sS -X GET "https://prooflaunch.fun/api/keycard/sync" \
              -H "x-vercel-cron: 1" --max-time 110 \
              -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 600
          else
            echo "skipped — not a 10-min mark"
          fi

      - name: airdrop/daily (top of the hour)
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" = "00" ]; then
            curl -sS -X GET "https://prooflaunch.fun/api/airdrop/daily" \
              -H "x-vercel-cron: 1" --max-time 110 \
              -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 600
          else
            echo "skipped — not on the hour"
          fi

      - name: wallet-claim/burn (top of the hour)
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" = "00" ]; then
            curl -sS -X GET "https://prooflaunch.fun/api/wallet-claim/burn" \
              -H "x-vercel-cron: 1" --max-time 110 \
              -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 600
          else
            echo "skipped — not on the hour"
          fi

      - name: health/drift (daily 13:00 UTC)
        run: |
          HR=$(date -u +%H)
          MIN=$(date -u +%M)
          if [ "$HR" = "13" ] && [ "$MIN" = "00" ]; then
            curl -sS -X GET "https://prooflaunch.fun/api/health/drift" \
              -H "x-vercel-cron: 1" --max-time 110 \
              -w "\nHTTP %{http_code} time=%{time_total}s\n" | tail -c 600
          else
            echo "skipped — only fires at 13:00 UTC daily"
          fi

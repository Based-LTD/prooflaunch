<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(/IBMPlexMono-SemiBold.woff)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1000px;height:1000px;background:#0a0a0a;font-family:Plex,"IBM Plex Mono",ui-monospace,monospace;position:relative;overflow:hidden}
.frame{position:absolute;inset:0;border:35px solid #ff9d00;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mark{font-size:470px;color:#ff9d00;letter-spacing:-.04em;line-height:1;margin-top:-70px}
.mark span{opacity:.55;margin:0 20px}
.rhc{position:absolute;left:35px;right:35px;bottom:35px;height:132px;background:#ff9d00;display:flex;align-items:center;justify-content:center;gap:28px}
.rhc .t{font-size:74px;color:#0a0a0a;letter-spacing:.18em;font-weight:600}
.rhc .s{width:14px;height:14px;background:#0a0a0a}
</style></head><body>
<div class="frame"><div class="mark">P<span>/</span>L</div></div>
<div class="rhc"><span class="s"></span><span class="t">RHC</span><span class="s"></span></div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(/IBMPlexMono-SemiBold.woff)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;height:500px;background:#0a0a0a;color:#e8e6df;font-family:Plex,"IBM Plex Mono",ui-monospace,monospace;position:relative;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 32px;font-size:16px;color:#5a5a52;letter-spacing:.2em;height:44px}
.top{border-bottom:1px solid #5a5a52}.bot{border-top:1px solid #5a5a52}
.dot{width:10px;height:10px;background:#00d97e;display:inline-block;margin-right:12px;vertical-align:-1px}
.amber{color:#ff9d00}.gold{color:#ffd400}
.body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 80px}
.col{display:flex;flex-direction:column;align-items:center;gap:14px}
.mark{font-size:92px;letter-spacing:-.02em;line-height:1;text-transform:uppercase}
.chain{font-size:22px;letter-spacing:.35em;text-transform:uppercase;color:#ffd400;border:1px solid rgba(255,212,0,.55);padding:8px 22px;margin-top:2px}
.sub{font-size:24px;color:#5a5a52;margin-top:6px;text-align:center}
.c{position:absolute;width:16px;height:16px}
.tl{top:60px;left:32px;border-top:2px solid #ff9d00;border-left:2px solid #ff9d00}
.tr{top:60px;right:32px;border-top:2px solid #ff9d00;border-right:2px solid #ff9d00}
.bl{bottom:60px;left:32px;border-bottom:2px solid #ff9d00;border-left:2px solid #ff9d00}
.br{bottom:60px;right:32px;border-bottom:2px solid #ff9d00;border-right:2px solid #ff9d00}
</style></head><body>
<div class="bar top"><span><span class="dot"></span>MAINNET · LIVE</span><span class="amber">// PROOF_LAUNCH.SYS</span></div>
<div class="body"><div class="col">
  <div class="mark">Proof<span class="amber">/</span>Launch</div>
  <div class="chain">on Robinhood Chain</div>
  <div class="sub">Pooled token launches. Equal entry. Every trade burns $PLAUNCH.</div>
</div></div>
<div class="bar bot"><span>SEATS · BACKERS · LAUNCH · BURN</span><span class="amber">prooflaunch.fun/rhc</span></div>
<div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div>
</body></html>
